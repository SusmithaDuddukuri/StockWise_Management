<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | StockWise</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/extra.css">
<link rel="stylesheet" href="../assets/css/pad.css">
<link rel="stylesheet" href="../assets/css/final.css">
<link rel="stylesheet" href="../assets/css/more.css">
<link rel="stylesheet" href="../assets/css/ultra.css">

<script src="../assets/js/app.js" defer></script>
<script src="../assets/js/extra.js" defer></script>
<script src="../assets/js/pad.js" defer>
<script src="../assets/js/more.js" defer></script>
</script>
</head><body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-header"><i class="fas fa-cubes"></i> StockWise</div>
  <nav style="padding:.75rem 0">
<a href="../index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
<a href="../pages/dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="../pages/inventory.html" class="nav-item"><i class="fas fa-boxes"></i> Inventory</a>
<a href="../pages/orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Purchase Orders</a>
<a href="../pages/suppliers.html" class="nav-item"><i class="fas fa-truck"></i> Suppliers</a>
<a href="../pages/warehouses.html" class="nav-item"><i class="fas fa-warehouse"></i> Warehouses</a>
<a href="../pages/movements.html" class="nav-item"><i class="fas fa-exchange-alt"></i> Stock Movements</a>
<a href="../pages/reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> Reports</a>
<a href="../pages/settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
</nav>
</aside>
<main class="main">
  <header class="topbar">
    <h1 style="font-size:1.25rem;font-weight:600">Reports</h1>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="btn btn-sm btn-outline" id="themeToggle"><i class="fas fa-moon"></i></button>
      <button class="btn btn-sm btn-outline" onclick="SW.showToast('Alerts','2 low-stock items','warning')"><i class="fas fa-bell"></i></button>
      <button class="btn btn-sm" onclick="openModal('Quick Add','<form data-validate><div class=form-group><label>Item Name</label><input class=form-control required></div><div class=form-group><label>Quantity</label><input type=number class=form-control></div><button class=btn type=submit>Add</button></form>')"><i class="fas fa-plus"></i> Add</button>
    </div>
  </header>
  <div class="content">

<div class="stat-grid">
  <div class="stat" style="cursor:pointer" onclick="SW.showToast('Report','Generating stock valuation...','info')"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div><div><div class="stat-value">₹48.2L</div><div class="stat-label">Total Stock Value</div></div></div>
  <div class="stat" style="cursor:pointer" onclick="SW.showToast('Report','Turnover report...','info')"><div class="stat-icon" style="background:#22c55e"><i class="fas fa-sync"></i></div><div><div class="stat-value">4.2x</div><div class="stat-label">Inventory Turnover</div></div></div>
  <div class="stat" style="cursor:pointer" onclick="SW.showToast('Report','Aging analysis...','info')"><div class="stat-icon" style="background:#eab308"><i class="fas fa-clock"></i></div><div><div class="stat-value">18%</div><div class="stat-label">Aging > 90 days</div></div></div>
</div>
<div class="card"><div class="card-header">Quick Reports</div><div class="card-body page-actions">
  <button class="btn btn-outline" onclick="SW.showToast('Report','Stock level report','info')">Stock Levels</button>
  <button class="btn btn-outline" onclick="SW.showToast('Report','Supplier performance','info')">Supplier Scorecard</button>
  <button class="btn btn-outline" onclick="SW.showToast('Report','Movement history','info')">Movement History</button>
  <button class="btn btn-outline" onclick="SW.showToast('Report','ABC analysis','info')">ABC Analysis</button>
</div></div>

  </div>
</main></div>
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal"><div class="modal-header"><h3 id="modalTitle">Modal</h3><button id="modalClose" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted)">&times;</button></div>
  <div class="modal-body" id="modalBody"></div></div>
</div>
<div id="toastContainer" class="toast-container"></div>
</body></html>
